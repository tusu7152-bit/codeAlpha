<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flashcard Quiz App</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            padding: 40px 25px;
            min-height: 250px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #question {
            font-size: 24px;
            color: #333;
            margin-bottom: 20px;
        }

        #answer {
            font-size: 20px;
            color: #007bff;
            margin-bottom: 20px;
        }

        button {
            padding: 10px 18px;
            margin: 5px;
            border: none;
            border-radius: 6px;
            background: #007bff;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #0056b3;
        }

        .delete {
            background: #dc3545;
        }

        .delete:hover {
            background: #a71d2a;
        }

        .edit {
            background: #28a745;
        }

        .edit:hover {
            background: #1e7e34;
        }

        .add-box {
            background: white;
            padding: 20px;
            margin-top: 20px;
            border-radius: 10px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 7px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        .navigation {
            margin-top: 15px;
        }

        #counter {
            margin-top: 10px;
            color: #666;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📚 Flashcard Quiz App</h1>

    <!-- Flashcard -->
    <div class="card">

        <h2 id="question">Question</h2>

        <p id="answer" style="display: none;">
            Answer
        </p>

        <button onclick="showAnswer()">
            Show Answer
        </button>

        <div>
            <button class="edit" onclick="editCard()">
                Edit
            </button>

            <button class="delete" onclick="deleteCard()">
                Delete
            </button>
        </div>

    </div>

    <!-- Navigation -->
    <div class="navigation">

        <button onclick="previousCard()">
            Previous
        </button>

        <button onclick="nextCard()">
            Next
        </button>

        <p id="counter"></p>

    </div>


    <!-- Add Flashcard -->
    <div class="add-box">

        <h2>Add New Flashcard</h2>

        <input
            type="text"
            id="questionInput"
            placeholder="Enter Question"
        >

        <input
            type="text"
            id="answerInput"
            placeholder="Enter Answer"
        >

        <button onclick="addCard()">
            Add Flashcard
        </button>

    </div>

</div>


<script>

    // Default flashcards
    let cards = JSON.parse(localStorage.getItem("flashcards")) || [

        {
            question: "What is HTML?",
            answer: "HTML stands for HyperText Markup Language."
        },

        {
            question: "What is CSS?",
            answer: "CSS is used to style HTML web pages."
        },

        {
            question: "What is JavaScript?",
            answer: "JavaScript is a programming language used to make web pages interactive."
        }

    ];


    let currentIndex = 0;


    // Display current flashcard
    function displayCard() {

        if (cards.length === 0) {

            document.getElementById("question").textContent =
                "No Flashcards Available";

            document.getElementById("answer").style.display =
                "none";

            document.getElementById("counter").textContent =
                "0 / 0";

            return;
        }


        document.getElementById("question").textContent =
            cards[currentIndex].question;


        document.getElementById("answer").textContent =
            cards[currentIndex].answer;


        // Hide answer when changing card
        document.getElementById("answer").style.display =
            "none";


        document.getElementById("counter").textContent =
            (currentIndex + 1) + " / " + cards.length;
    }


    // Show answer
    function showAnswer() {

        document.getElementById("answer").style.display =
            "block";
    }


    // Next card
    function nextCard() {

        if (cards.length === 0) return;

        currentIndex++;

        if (currentIndex >= cards.length) {
            currentIndex = 0;
        }

        displayCard();
    }


    // Previous card
    function previousCard() {

        if (cards.length === 0) return;

        currentIndex--;

        if (currentIndex < 0) {
            currentIndex = cards.length - 1;
        }

        displayCard();
    }


    // Add new flashcard
    function addCard() {

        let question =
            document.getElementById("questionInput").value.trim();

        let answer =
            document.getElementById("answerInput").value.trim();


        if (question === "" || answer === "") {

            alert("Please enter both question and answer.");

            return;
        }


        cards.push({
            question: question,
            answer: answer
        });


        // Save data
        saveCards();


        // Show newly added card
        currentIndex = cards.length - 1;


        // Clear input fields
        document.getElementById("questionInput").value = "";

        document.getElementById("answerInput").value = "";


        displayCard();

        alert("Flashcard added successfully!");
    }


    // Edit current flashcard
    function editCard() {

        if (cards.length === 0) return;


        let newQuestion =
            prompt(
                "Enter new question:",
                cards[currentIndex].question
            );


        let newAnswer =
            prompt(
                "Enter new answer:",
                cards[currentIndex].answer
            );


        if (
            newQuestion !== null &&
            newAnswer !== null &&
            newQuestion.trim() !== "" &&
            newAnswer.trim() !== ""
        ) {

            cards[currentIndex].question =
                newQuestion.trim();

            cards[currentIndex].answer =
                newAnswer.trim();


            saveCards();

            displayCard();

            alert("Flashcard updated!");
        }
    }


    // Delete current flashcard
    function deleteCard() {

        if (cards.length === 0) return;


        let confirmDelete =
            confirm("Are you sure you want to delete this flashcard?");


        if (confirmDelete) {

            cards.splice(currentIndex, 1);


            if (currentIndex >= cards.length) {
                currentIndex = cards.length - 1;
            }


            if (currentIndex < 0) {
                currentIndex = 0;
            }


            saveCards();

            displayCard();
        }
    }


    // Save cards in Local Storage
    function saveCards() {

        localStorage.setItem(
            "flashcards",
            JSON.stringify(cards)
        );
    }


    // Load app
    displayCard();

</script>

</body>
</html>

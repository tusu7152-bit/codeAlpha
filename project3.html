<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fitness Tracker</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f2f2f2;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .card h3 {
            color: #555;
            margin-bottom: 10px;
        }

        .card p {
            font-size: 25px;
            font-weight: bold;
            color: #007bff;
        }

        .form-box {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .form-box h2 {
            margin-bottom: 20px;
            color: #333;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .progress-box {
            background: white;
            padding: 25px;
            margin-top: 20px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .progress {
            background: #ddd;
            height: 15px;
            border-radius: 10px;
            margin: 10px 0 20px;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: #007bff;
            border-radius: 10px;
        }

        @media (max-width: 600px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🏃 Fitness Tracker</h1>

    <!-- Dashboard -->
    <div class="dashboard">

        <div class="card">
            <h3>Steps</h3>
            <p id="steps">0</p>
        </div>

        <div class="card">
            <h3>Workout</h3>
            <p id="workout">0 min</p>
        </div>

        <div class="card">
            <h3>Calories</h3>
            <p id="calories">0 kcal</p>
        </div>

    </div>

    <!-- Input Form -->
    <div class="form-box">

        <h2>Enter Today's Activity</h2>

        <label>Steps</label>
        <input type="number" id="stepsInput" placeholder="Enter steps">

        <label>Workout Time (Minutes)</label>
        <input type="number" id="workoutInput" placeholder="Enter workout minutes">

        <label>Calories Burned</label>
        <input type="number" id="caloriesInput" placeholder="Enter calories">

        <button onclick="saveData()">Save Activity</button>

    </div>

    <!-- Progress -->
    <div class="progress-box">

        <h2>Daily Progress</h2>

        <p>Steps Goal: 10,000</p>
        <div class="progress">
            <div class="progress-bar" id="stepsProgress"></div>
        </div>

        <p>Workout Goal: 60 Minutes</p>
        <div class="progress">
            <div class="progress-bar" id="workoutProgress"></div>
        </div>

        <p>Calories Goal: 500 kcal</p>
        <div class="progress">
            <div class="progress-bar" id="caloriesProgress"></div>
        </div>

    </div>

</div>


<script>

    // Load saved data when app starts
    window.onload = function() {
        loadData();
    };


    // Save fitness data
    function saveData() {

        let steps = Number(document.getElementById("stepsInput").value);
        let workout = Number(document.getElementById("workoutInput").value);
        let calories = Number(document.getElementById("caloriesInput").value);

        // Save data in Local Storage
        localStorage.setItem("steps", steps);
        localStorage.setItem("workout", workout);
        localStorage.setItem("calories", calories);

        // Update dashboard
        displayData(steps, workout, calories);

        alert("Fitness data saved successfully!");
    }


    // Display data
    function displayData(steps, workout, calories) {

        document.getElementById("steps").textContent = steps;

        document.getElementById("workout").textContent =
            workout + " min";

        document.getElementById("calories").textContent =
            calories + " kcal";


        // Calculate progress percentage

        let stepsPercent = (steps / 10000) * 100;
        let workoutPercent = (workout / 60) * 100;
        let caloriesPercent = (calories / 500) * 100;


        // Maximum progress = 100%
        stepsPercent = Math.min(stepsPercent, 100);
        workoutPercent = Math.min(workoutPercent, 100);
        caloriesPercent = Math.min(caloriesPercent, 100);


        // Update progress bars

        document.getElementById("stepsProgress").style.width =
            stepsPercent + "%";

        document.getElementById("workoutProgress").style.width =
            workoutPercent + "%";

        document.getElementById("caloriesProgress").style.width =
            caloriesPercent + "%";
    }


    // Load data from Local Storage
    function loadData() {

        let steps = Number(localStorage.getItem("steps")) || 0;

        let workout = Number(localStorage.getItem("workout")) || 0;

        let calories = Number(localStorage.getItem("calories")) || 0;


        // Put saved values in input fields

        document.getElementById("stepsInput").value = steps;

        document.getElementById("workoutInput").value = workout;

        document.getElementById("caloriesInput").value = calories;


        // Display saved data

        displayData(steps, workout, calories);
    }

</script>

</body>
</html>
